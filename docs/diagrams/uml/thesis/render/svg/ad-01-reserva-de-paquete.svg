<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1355px" preserveAspectRatio="none" style="width:391px;height:1355px;background:#FFFFFF;" version="1.1" viewBox="0 0 391 1355" width="391px" zoomAndPan="magnify"><title>Proceso de reserva de un paquete tur&#237;stico</title><defs/><g><text fill="#111111" font-family="Arial" font-size="17" font-weight="bold" lengthAdjust="spacing" textLength="348.6162" x="20" y="35.9458">Proceso de reserva de un paquete tur&#237;stico</text><ellipse cx="195.8081" cy="60.5483" fill="#111111" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#FFFFFF" height="52.1973" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="367.1084" x="12.2539" y="90.5483"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="255.2676" x="22.2539" y="113.6802">Elegir paquete, fecha de salida y viajeros</text><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="347.1084" x="22.2539" y="129.7788">(y una opci&#243;n de vuelo cotizada si el paquete lo incluye)</text><rect fill="#FFFFFF" height="36.0986" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="287.7227" x="51.9468" y="162.7456"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="267.7227" x="61.9468" y="185.8774">Verificar paquete publicado y salida abierta</text><rect fill="#FFFFFF" height="36.0986" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="179.5439" x="106.0361" y="267.7437"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="159.5439" x="116.0361" y="290.8755">Informar que no hay cupo</text><ellipse cx="195.8081" cy="342.293" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="195.8081" cy="342.293" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#FFFFFF" points="126.5498,218.8442,265.0664,218.8442,277.0664,230.8442,265.0664,242.8442,126.5498,242.8442,114.5498,230.8442,126.5498,218.8442" style="stroke:#222222;stroke-width:0.5;"/><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="199.8081" y="254.1001">no</text><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="138.5166" x="126.5498" y="235.9268">&#191;Hay cupo suficiente?</text><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="9.334" x="277.0664" y="228.3013">s&#237;</text><rect fill="#FFFFFF" height="52.1973" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="278.4053" x="56.6055" y="395.293"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="210.875" x="66.6055" y="418.4248">Retener el cupo y crear la reserva</text><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="258.4053" x="66.6055" y="434.5234">pendiente de pago (vence en 30 minutos)</text><rect fill="#FFFFFF" height="36.0986" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="293.9229" x="48.8467" y="467.4902"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="273.9229" x="58.8467" y="490.6221">Solicitar el pago y revalidar el precio vigente</text><rect fill="#FFFFFF" height="36.0986" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="278.4053" x="56.6055" y="572.4883"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="258.4053" x="66.6055" y="595.6201">La reserva queda pendiente hasta vencer</text><ellipse cx="195.8081" cy="647.0376" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="195.8081" cy="647.0376" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#FFFFFF" points="61.9639,523.5889,329.6523,523.5889,341.6523,535.5889,329.6523,547.5889,61.9639,547.5889,49.9639,535.5889,61.9639,523.5889" style="stroke:#222222;stroke-width:0.5;"/><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="9.334" x="199.8081" y="558.8447">s&#237;</text><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="267.6885" x="61.9639" y="540.6714">&#191;El precio cambi&#243; y el turista no lo acepta?</text><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="341.6523" y="533.0459">no</text><rect fill="#FFFFFF" height="36.0986" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="128.1514" x="131.7324" y="700.0376"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="108.1514" x="141.7324" y="723.1694">Cobrar la reserva</text><rect fill="#FFFFFF" height="36.0986" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="277.6055" x="57.0054" y="805.0356"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="257.6055" x="67.0054" y="828.1675">Puede reintentarse antes del vencimiento</text><ellipse cx="195.8081" cy="879.585" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="195.8081" cy="879.585" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#FFFFFF" points="139.7637,756.1362,251.8525,756.1362,263.8525,768.1362,251.8525,780.1362,139.7637,780.1362,127.7637,768.1362,139.7637,756.1362" style="stroke:#222222;stroke-width:0.5;"/><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="199.8081" y="791.3921">no</text><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="112.0889" x="139.7637" y="773.2188">&#191;Pago aprobado?</text><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="9.334" x="263.8525" y="765.5933">s&#237;</text><rect fill="#FFFFFF" height="36.0986" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="263.5781" x="64.019" y="981.4844"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="243.5781" x="74.019" y="1004.6162">Emitir el pasaje con el proveedor a&#233;reo</text><rect fill="#FFFFFF" height="52.1973" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="237.1025" x="77.2568" y="1086.4824"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="217.1025" x="87.2568" y="1109.6143">Cancelar la reserva, liberar el cupo</text><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="108.1445" x="87.2568" y="1125.7129">y revertir el cobro</text><ellipse cx="195.8081" cy="1169.6797" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="195.8081" cy="1169.6797" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><polygon fill="#FFFFFF" points="141.7256,1037.583,249.8906,1037.583,261.8906,1049.583,249.8906,1061.583,141.7256,1061.583,129.7256,1049.583,141.7256,1037.583" style="stroke:#222222;stroke-width:0.5;"/><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="199.8081" y="1072.8389">no</text><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="108.165" x="141.7256" y="1054.6655">&#191;Pasaje emitido?</text><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="9.334" x="261.8906" y="1047.04">s&#237;</text><polygon fill="#FFFFFF" points="146.7808,932.585,244.8354,932.585,256.8354,944.585,244.8354,956.585,146.7808,956.585,134.7808,944.585,146.7808,932.585" style="stroke:#222222;stroke-width:0.5;"/><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="9.334" x="199.8081" y="967.8408">s&#237;</text><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="98.0547" x="146.7808" y="949.6675">&#191;Incluye vuelo?</text><text fill="#111111" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="256.8354" y="942.042">no</text><polygon fill="#FFFFFF" points="195.8081,1222.6797,207.8081,1234.6797,195.8081,1246.6797,183.8081,1234.6797,195.8081,1222.6797" style="stroke:#222222;stroke-width:0.5;"/><rect fill="#FFFFFF" height="36.0986" rx="3" ry="3" style="stroke:#222222;stroke-width:0.5;" width="146.8135" x="122.4014" y="1266.6797"/><text fill="#111111" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="126.8135" x="132.4014" y="1289.8115">Confirmar la reserva</text><ellipse cx="195.8081" cy="1333.7783" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="195.8081" cy="1333.7783" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#222222;stroke-width:1.1;" x1="195.8081" x2="195.8081" y1="70.5483" y2="90.5483"/><polygon fill="#222222" points="191.8081,80.5483,195.8081,90.5483,199.8081,80.5483,195.8081,84.5483" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#222222;stroke-width:1.1;" x1="195.8081" x2="195.8081" y1="142.7456" y2="162.7456"/><polygon fill="#222222" points="191.8081,152.7456,195.8081,162.7456,199.8081,152.7456,195.8081,156.7456" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#222222;stroke-width:1.1;" x1="195.8081" x2="195.8081" y1="303.8423" y2="331.293"/><polygon fill="#222222" points="191.8081,321.293,195.8081,331.293,199.8081,321.293,195.8081,325.293" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#222222;stroke-width:1.1;" x1="195.8081" x2="195.8081" y1="242.8442" y2="267.7437"/><polygon fill="#222222" points="191.8081,257.7437,195.8081,267.7437,199.8081,257.7437,195.8081,261.7437" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#222222;stroke-width:1.1;" x1="277.0664" x2="295.